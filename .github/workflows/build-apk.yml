name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install required Android packages
        run: sdkmanager "platforms;android-34" "build-tools;34.0.0"

      - name: Package web app into Android assets
        run: |
          mkdir -p android/app/src/main/assets
          cp index.html android/app/src/main/assets/
          cp app.js android/app/src/main/assets/
          cp styles.css android/app/src/main/assets/
          cp jszip.min.js android/app/src/main/assets/
          cp manifest.webmanifest android/app/src/main/assets/
          cp service-worker.js android/app/src/main/assets/
          if [ -d icons ]; then cp -R icons android/app/src/main/assets/; fi
          sed -i 's/v1\.1\.1/v1.1.3/g' android/app/src/main/assets/index.html

      - name: Build unsigned release APK
        run: gradle -p android :app:assembleRelease --stacktrace

      - name: Align unsigned APK
        run: |
          IN=android/app/build/outputs/apk/release/app-release-unsigned.apk
          OUT=EBR_Drill_Viewer_v1.1.3_UNSIGNED_ALIGNED.apk
          "$ANDROID_HOME/build-tools/34.0.0/zipalign" -f -p 4 "$IN" "$OUT"
          "$ANDROID_HOME/build-tools/34.0.0/zipalign" -c -v 4 "$OUT"
          "$ANDROID_HOME/build-tools/34.0.0/aapt" dump badging "$OUT" | head -n 2

      - name: Upload unsigned aligned APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: EBR_Drill_Viewer_v1.1.3_UNSIGNED_ALIGNED
          path: EBR_Drill_Viewer_v1.1.3_UNSIGNED_ALIGNED.apk
          if-no-files-found: error
