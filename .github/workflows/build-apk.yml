name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Install Android SDK 34
        uses: android-actions/setup-android@v3

      - name: Install required Android packages
        run: sdkmanager "platforms;android-34" "build-tools;34.0.0"

      - name: Package web app into Android assets
        run: |
          mkdir -p android/app/src/main/assets
          cp index.html android/app/src/main/assets/
          cp app.js android/app/src/main/assets/
          cp styles.css android/app/src/main/assets/
          cp jszip.min.js android/app/src/main/assets/
          cp manifest.webmanifest android/app/src/main/assets/
          cp service-worker.js android/app/src/main/assets/
          if [ -d icons ]; then cp -R icons android/app/src/main/assets/; fi

      - name: Build debug APK
        run: gradle -p android :app:assembleDebug --stacktrace

      - name: Rename APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk EBR_Drill_Viewer_v1.1.1.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: EBR_Drill_Viewer_v1.1.1_APK
          path: EBR_Drill_Viewer_v1.1.1.apk
          if-no-files-found: error
